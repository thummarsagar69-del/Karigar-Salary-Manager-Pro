<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Report</title>

<link rel="stylesheet" href="style.css">

<style>
.table-wrap{
overflow-x:auto;
margin-top:15px;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
}

table th,
table td{
border:1px solid #ddd;
padding:10px;
text-align:center;
font-size:14px;
}

table th{
background:#0d6efd;
color:#fff;
}

.action-btn{
padding:6px 12px;
border:none;
border-radius:6px;
cursor:pointer;
background:#198754;
color:#fff;
}

.total-box{
margin-top:15px;
padding:15px;
background:#f8f9fa;
border-radius:8px;
text-align:right;
font-size:18px;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<header class="header">
<h1>📊 Salary Report</h1>
<p>કારીગરનો પગાર રિપોર્ટ</p>
</header>

<div class="list-card">

<label>મહિનો પસંદ કરો</label>
<input type="month" id="month" onchange="loadReport()">

<label style="margin-top:15px;">કારીગર પસંદ કરો</label>

<select id="workerFilter" onchange="loadReport()">
<option value="">બધા કારીગર</option>
</select>

</div>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>ક્રમ</th>
<th>કારીગર</th>
<th>હાજરી</th>
<th>કલાક</th>
<th>પગાર</th>
<th>Action</th>

</tr>

</thead>

<tbody id="reportBody">

</tbody>

</table>

</div>

<div id="grandTotal" class="total-box">
કુલ પગાર : ₹0
</div>

<div style="padding:15px;display:flex;gap:10px;flex-wrap:wrap;">

<button onclick="window.print()">
🖨️ બધા Print
</button>

<button onclick="downloadAllPDF()">
📄 બધા PDF
</button>

</div>

<div style="padding:15px;">
<a href="index.html" class="btn">🏠 Dashboard</a>
</div>

</div>

<script src="report.js"></script>

</body>
</html>
