<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Master</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>👷 Worker Master</h1>
<p>કારીગર ઉમેરો અને મેનેજ કરો</p>
</header>

<div class="list-card">

<input type="text" id="name" placeholder="કારીગરનું નામ">

<input type="tel" id="mobile" placeholder="મોબાઇલ નંબર">

<input type="text" id="work" placeholder="કામનો પ્રકાર">

<input type="number" id="rate" placeholder="કલાકનો પગાર">

<button onclick="saveWorker()">
💾 Save Worker
</button>

</div>

<div class="list-card">

<input
type="text"
id="search"
placeholder="🔍 કારીગર શોધો..."
onkeyup="searchWorker()">

</div>

<div id="workerList"></div>

<div style="padding:15px;">
<a href="index.html" class="btn">🏠 Dashboard</a>
</div>

</div>

<script src="js/worker.js"></script>

</body>
</html>
