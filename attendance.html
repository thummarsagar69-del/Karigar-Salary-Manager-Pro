<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>📅 હાજરી</h1>
<p>રોજની હાજરી અને પગાર</p>
</header>

<div class="list-card">

<label>તારીખ</label>
<input type="date" id="date">

<label>કારીગર</label>
<select id="worker" onchange="setRate()">
<option value="">કારીગર પસંદ કરો</option>
</select>

<label>કલાકનો પગાર</label>
<input type="number" id="rate" readonly>

<label>કામ કરેલા કલાક</label>
<input
    type="number"
    id="hours"
    placeholder="કલાક લખો"
    oninput="calculateSalary()">

<label>કુલ પગાર</label>
<input type="number" id="salary" readonly>

<button onclick="saveAttendance()">
💾 હાજરી સેવ કરો
</button>

</div>
<div class="list-card">

<h3>📊 Attendance Report</h3>

<input
type="text"
id="searchWorker"
placeholder="🔍 કારીગર શોધો..."
onkeyup="searchWorker()">

<br><br>

<label>અઠવાડિયું</label>
<input type="week" id="weekFilter" onchange="loadWeeklyAttendance()">

<label>કારીગર</label>
<select id="workerFilter" onchange="loadWeeklyAttendance()">
    <option value="">બધા કારીગર</option>
</select>

<div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;">
    <button onclick="exportPDF()">📄 PDF</button>
    <button onclick="exportExcel()">📊 Excel</button>
</div>

</div>
<h2 style="padding:15px;">📅 અઠવાડિયાની હાજરી</h2>

<div style="overflow-x:auto; padding:15px;">

<table class="table" id="weeklyTable">

<thead>

<tr id="weekHeader">

<th>કારીગર</th>

<th>--<br>સોમ</th>
<th>--<br>મંગળ</th>
<th>--<br>બુધ</th>
<th>--<br>ગુરુ</th>
<th>--<br>શુક્ર</th>
<th>--<br>શનિ</th>
<th>--<br>રવિ</th>

<th>કુલ કલાક</th>
<th>કુલ પગાર</th>

</tr>

</thead>

<tbody id="weeklyBody">

</tbody>

</table>

</div>

<h2 style="padding:15px;">આજની હાજરી</h2>



<div style="margin-top:20px;">
<h3>📋 આજની હાજરી</h3>

<table class="table">

<thead>

<tr>

<th>કારીગર</th>
<th>કલાક</th>
<th>પગાર</th>
<th>Action</th>

</tr>

</thead>

<tbody id="todayBody">

</tbody>

</table>

</div>

<div style="padding:15px;">
<a href="index.html" class="btn">🏠 Dashboard</a>
</div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="attendance.js"></script>

</body>
</html>
